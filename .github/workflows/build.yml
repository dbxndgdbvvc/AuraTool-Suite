# AuraTool-Suite — Cross-Platform Build Workflow
# Builds standalone executables for Windows x64 and Linux x64
# Triggered on push to master, tags, or manual dispatch

name: Build AuraTool-Suite

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build Linux executable
        run: |
          python build.py

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraTool-Suite-Linux-x64
          path: dist/AuraTool-Suite/
          retention-days: 30

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build Windows executable
        run: |
          python build_windows.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraTool-Suite-Windows-x64
          path: dist/AuraTool-Suite/
          retention-days: 30

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run unit tests
        run: |
          pip install pytest
          python -m pytest tests/ -v --tb=short

  release:
    needs: [build-linux, build-windows, test]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AuraTool-Suite-Linux-x64/*
            AuraTool-Suite-Windows-x64/*
          generate_release_notes: true

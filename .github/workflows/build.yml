# AuraTool-Suite — Dual-Platform CI/CD Build Workflow
#
# Builds standalone --onefile executables for Linux x64 and Windows x64.
# All source code, libraries, and assets are hidden inside a single binary.
# Uploads release packages as artifacts.
# Creates a GitHub Release with both binaries on version tags.
#
# Triggers:
#   - Push to main (build + test)
#   - Version tags v* (build + test + release)
#   - Pull requests to main (build + test)
#   - Manual dispatch with optional version input

name: Build & Release AuraTool-Suite

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label (e.g. 2.1.0). Leave empty to auto-detect from tag.'
        required: false
        default: ''

# Cancel in-progress runs for the same branch/tag
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  APP_NAME: AuraTool-Suite

jobs:
  # ─────────────────────────────────────────────────────────────
  # Lint & Unit Tests
  # ─────────────────────────────────────────────────────────────
  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pillow fpdf pyyaml arabic-reshaper python-bidi \
                      psutil rich tqdm pyserial pyusb requests

      - name: Run unit tests
        run: |
          python -m pytest tests/ -v --tb=short

  # ─────────────────────────────────────────────────────────────
  # Linux x64 Build (--onefile standalone)
  # ─────────────────────────────────────────────────────────────
  build-linux:
    name: 🐧 Linux x64
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow fpdf pyyaml arabic-reshaper python-bidi \
                      psutil rich tqdm pyserial pyusb requests

      - name: Build Linux onefile binary
        run: python build_standalone.py --linux-only

      - name: Verify binary
        run: |
          echo "=== Binary Info ==="
          ls -lh dist/AuraTool-Suite
          file dist/AuraTool-Suite
          echo ""
          echo "=== Quick Smoke Test ==="
          timeout 5 dist/AuraTool-Suite 2>&1 || true

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APP_NAME }}-Linux-x64
          path: dist/AuraTool-Suite
          retention-days: 30
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # Windows x64 Build (--onefile standalone, native Windows runner)
  # ─────────────────────────────────────────────────────────────
  build-windows:
    name: 🪟 Windows x64
    runs-on: windows-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow fpdf pyyaml arabic-reshaper python-bidi \
                      psutil rich tqdm pyserial pyusb requests

      - name: Build Windows onefile binary
        run: python build_standalone.py --windows-only

      - name: Verify binary
        shell: pwsh
        run: |
          Write-Host "=== Binary Info ==="
          Get-ChildItem dist/AuraTool-Suite.exe | Select-Object Name, Length
          Write-Host ""
          Write-Host "=== Quick Smoke Test ==="
          $proc = Start-Process -FilePath "dist\AuraTool-Suite.exe" -PassThru -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5
          if (!$proc.HasExited) { $proc.Kill() }
          Write-Host "Binary launched successfully"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APP_NAME }}-Windows-x64
          path: dist/AuraTool-Suite.exe
          retention-days: 30
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # Create GitHub Release (only on version tags)
  # ─────────────────────────────────────────────────────────────
  release:
    name: 🚀 Release
    needs: [test, build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-Linux-x64
          path: artifacts/linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-Windows-x64
          path: artifacts/windows

      - name: List artifacts
        run: |
          echo "=== Linux ==="
          ls -lh artifacts/linux/
          echo ""
          echo "=== Windows ==="
          ls -lh artifacts/windows/

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            TAG="${GITHUB_REF#refs/tags/v}"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release notes
        run: |
          TAG="${{ steps.version.outputs.tag }}"

          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s" --no-merges)
          else
            CHANGES=$(git log --pretty=format:"- %s" --no-merges -20)
          fi

          cat > release_notes.md << NOTES
          ## AuraTool-Suite v${TAG}

          ### Downloads

          | Platform | File | Description |
          |----------|------|-------------|
          | 🐧 Linux x64 | \`AuraTool-Suite\` | Single-file ELF binary (all code hidden inside) |
          | 🪟 Windows x64 | \`AuraTool-Suite.exe\` | Single-file .exe (all code hidden inside) |

          ### Changes

          ${CHANGES}

          ### Installation

          **Linux:**
          \`\`\`bash
          chmod +x AuraTool-Suite
          ./AuraTool-Suite
          \`\`\`

          **Windows:** Double-click \`AuraTool-Suite.exe\`

          ### Requirements

          - USB device drivers for target devices
          - Valid AuraTool-Suite license key for activation

          ---

          *Built automatically by GitHub Actions CI/CD*
          NOTES

          echo "=== Release Notes ==="
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "AuraTool-Suite v${{ steps.version.outputs.tag }}"
          body_path: release_notes.md
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/linux/AuraTool-Suite
            artifacts/windows/AuraTool-Suite.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
